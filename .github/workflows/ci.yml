name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run type check
        run: npx tsc --noEmit
        working-directory: web

      - name: Run lint
        run: npm run lint
        working-directory: web

      - name: Build application
        run: npm run build
        working-directory: web

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: web/.next/standalone/
          retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        working-directory: web
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          OUTPUT=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
          echo "$OUTPUT"
          DEPLOYMENT_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-z0-9-]+\.vercel\.app' | head -1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            DEPLOYMENT_URL=$(echo "$OUTPUT" | grep -oE 'https://[^ ]+' | tail -1)
          fi
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOYMENT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Health check
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          echo "Verifying deployment: $DEPLOY_URL"
          for i in 1 2 3 4 5; do
            echo "Check attempt $i/5..."
            STATE=$(vercel inspect "$DEPLOY_URL" --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | grep -i 'status' | head -1 || true)
            echo "  $STATE"
            if echo "$STATE" | grep -qi 'ready'; then
              echo "Deployment is READY"
              exit 0
            fi
            sleep 10
          done
          echo "Deployment did not reach READY state"
          vercel inspect "$DEPLOY_URL" --token=${{ secrets.VERCEL_TOKEN }} 2>&1
          exit 1

  # Post-deploy smoke test: fetch real pages from the deployment that was just
  # shipped. The deploy job's own health check only asks Vercel whether the
  # deployment reached READY — it never requests a page, so a deploy that builds
  # and serves 500s would still pass it.
  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      # Fail with a readable message rather than letting every request come back
      # as an unexplained 429 from Vercel's bot mitigation.
      - name: Verify bypass secret is configured
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS_SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set."
            echo "Vercel bot mitigation answers unauthenticated requests with HTTP 429"
            echo "(x-vercel-mitigated: challenge), so the smoke test cannot load any page."
            echo "Add it with: gh secret set VERCEL_AUTOMATION_BYPASS_SECRET"
            echo "The value is the project's Protection Bypass for Automation token"
            echo "(Vercel -> Project -> Settings -> Deployment Protection)."
            exit 1
          fi
          echo "Bypass secret is present."

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: web

      # Only full-app.spec.ts. The tool specs (fit/resume/interview/download-buttons)
      # depend on E2E_TESTING being set server-side to bypass the captcha, which
      # production deliberately does not set, so they would fail for reasons that
      # have nothing to do with deployment health.
      - name: Run smoke tests against the deployment
        run: npx playwright test e2e/full-app.spec.ts
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: web/playwright-report/
          retention-days: 7
